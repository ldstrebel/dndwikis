    1. Copy this file and rename it for your chapter (e.g., "my-campaign-ch1.html")
    2. Update the <title> tag below

    4. Add your content in the slideshow format below
    5. Update the slide counter to match your total slide count
    6. Test navigation and ensure all slides work properly
    
    SLIDESHOW STRUCTURE:
    - First slide: Remove "hidden" class (visible by default)
    - Additional slides: Add "hidden" class

    - Navigation automatically handles showing/hiding slides

<style>
    /* Base font for chapter pages if different from style.css */

    <div class="mt-6 flex items-center justify-center space-x-4 w-full max-w-5xl">
        <button id="prev-slide" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-sky-500">
            &larr; Previous
        </button>
        <div id="slide-counter" class="text-slate-400 text-sm">Slide 1 of 20</div>
        <button id="next-slide" class="bg-sky-600 hover:bg-sky-700 text-white font-semibold py-2 px-4 rounded-lg transition-colors duration-150 ease-in-out focus:outline-none focus:ring-2 focus:ring-sky-500">
            Next &rarr;
        </button>
    </div>

    <script>
        const slidesElements = document.querySelectorAll('.slide');
        const prevButton = document.getElementById('prev-slide');
        const nextButton = document.getElementById('next-slide');
        const slideCounter = document.getElementById('slide-counter');
        let currentIndex = 0;
        const totalSlides = slidesElements.length;

        function showSlide(index) {
            slidesElements.forEach((slide, i) => {
                slide.classList.toggle('hidden', i !== index);
            });
            if (slideCounter && totalSlides > 0) {
                slideCounter.textContent = `Slide ${index + 1} of ${totalSlides}`;
            }
        }

        if (totalSlides > 0) {
            showSlide(currentIndex);
        }

        if (prevButton) {
            prevButton.addEventListener('click', () => {
                currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
                showSlide(currentIndex);
            });
        }

        if (nextButton) {
            nextButton.addEventListener('click', () => {
                currentIndex = (currentIndex + 1) % totalSlides;
                showSlide(currentIndex);
            });
        }
        
        document.addEventListener('keydown', (event) => {
            if (totalSlides <= 1) return;
            if (event.key === 'ArrowLeft') {
                if (prevButton) prevButton.click();
            } else if (event.key === 'ArrowRight') {
                if (nextButton) nextButton.click();
            }
        });
    </script>

            // Optional: slight delay to ensure some paint before fade

                chapterOverlay.classList.add('visually-hidden');
            }, 150); // Adjust delay (e.g., 50-250ms) or remove for immediate hide attempt
        }
    });
</script>
</body>

</head>
<body>
    <div id="globalLoadingOverlayChapter">
        <img src="images/archway-loaded.gif" alt="Loading..." class="global-loading-gif" />
    </div>

    <div id="image-display-area">
        <img id="current-slide-image" src="" alt="Current Slide Image" style="display: none;" />
        <div id="image-placeholder">
             <!-- Placeholder content will be set by JS if no image -->
        </div>
    </div>

    <div id="text-display-area">
        <!-- Dialogue and scene text will be injected here by JS -->
    </div>

    <nav id="bottom-navigation">
        <a href="index.html" title="Go to Homepage" class="home-icon flex-shrink-0">
            <img src="images/archway-home.webp" alt="Home">
        </a>
        
        <div id="chapterTitle-bottom-nav" class="chapter-title-nav" title="Crawler 2">
            Crawler 2
        </div>
        
        <div class="navigation-controls flex-shrink-0">
            <button id="prev-slide" class="nav-button-icon" title="Previous Slide">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 19.5 8.25 12l7.5-7.5" />
                </svg>
            </button>
            <div id="slide-counter-nav" class="slide-counter-nav">
                1/20
            </div>
            <button id="next-slide" class="nav-button-icon" title="Next Slide">
                <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2.5" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" d="m8.25 4.5 7.5 7.5-7.5 7.5" />
                </svg>
            </button>
        </div>
    </nav>

    <script>
        const slidesData = [{}];
        const totalSlides = slidesData.length;
        let currentIndex = 0;

        const imageDisplay = document.getElementById('current-slide-image');
        const imagePlaceholder = document.getElementById('image-placeholder');
        const textDisplay = document.getElementById('text-display-area');
        const prevButton = document.getElementById('prev-slide');
        const nextButton = document.getElementById('next-slide');
        const slideCounterNav = document.getElementById('slide-counter-nav');
        
        const imageArea = document.getElementById('image-display-area');
        const navArea = document.getElementById('bottom-navigation');

        function setContentAreaPadding() {
            const imageAreaHeight = imageArea.offsetHeight;
            const navAreaHeight = navArea.offsetHeight;
            textDisplay.style.paddingTop = imageAreaHeight + 'px';
            textDisplay.style.paddingBottom = navAreaHeight + 'px';
        }

        function showSlide(index) {
            if (totalSlides === 0 || index < 0 || index >= totalSlides) {
                imageDisplay.style.display = 'none';
                imagePlaceholder.style.display = 'flex';
                imagePlaceholder.innerHTML = '<p class="text-slate-300 text-lg">No slides to display for this chapter.</p>';
                textDisplay.innerHTML = '';
                if (slideCounterNav) slideCounterNav.textContent = '0/0';
                if (prevButton) prevButton.disabled = true;
                if (nextButton) nextButton.disabled = true;
                return;
            }

            const slide = slidesData[index];
            
            // Image
            if (slide.imageSrc) {
                imageDisplay.src = slide.imageSrc;
                imageDisplay.alt = `Scene ${index + 1}`;
                imageDisplay.style.display = 'block';
                imagePlaceholder.style.display = 'none';
            } else {
                imageDisplay.style.display = 'none';
                imagePlaceholder.style.display = 'flex';
                imagePlaceholder.innerHTML = `
                    <div class="text-sm text-slate-300 p-2 text-center">
                        <p class="font-semibold text-sky-400 mb-1">Image Placeholder</p>
                        <p class="text-xs">${slide.imagePrompt ? `Prompt: ${slide.imagePrompt.replace(/</g, "&lt;").replace(/>/g, "&gt;")}` : 'No image prompt provided.'}</p>
                    </div>
                `;
            }

            // Text
            let dialogueHtml = '';
            if (slide.dialogueEntries && slide.dialogueEntries.length > 0) {
                dialogueHtml = slide.dialogueEntries.map(entry => {
                    const speakerNameHtml = entry.type === 'Character' && entry.speakerName ? `<strong class="font-semibold text-sky-300">${entry.speakerName.replace(/</g, "&lt;").replace(/>/g, "&gt;")}:</strong> ` : '';
                    const textClass = entry.type === 'Narrator' ? 'italic text-slate-300' : 'text-slate-100';
                    return `<div class="p-1.5 my-1 text-sm md:text-base ${textClass}">${speakerNameHtml}${entry.text.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`;
                }).join('');
            } else if (slide.sceneText) { // Fallback to sceneText if no dialogue
                 dialogueHtml = `<div class="p-1.5 my-1 text-sm md:text-base italic text-slate-300">${slide.sceneText.replace(/</g, "&lt;").replace(/>/g, "&gt;")}</div>`;
            } else {
                 dialogueHtml = '<p class="text-slate-400 text-sm p-2">No text for this scene.</p>';
            }
            textDisplay.innerHTML = dialogueHtml;
            textDisplay.scrollTop = 0; // Scroll to top of text area

            // Update counter
            if (slideCounterNav) {
              slideCounterNav.textContent = `${index + 1}/${totalSlides}`; // Changed format
            }

            // Update button states
            if (prevButton) prevButton.disabled = totalSlides <= 1; // Disable if only one slide or no slides
            if (nextButton) nextButton.disabled = totalSlides <= 1; // Disable if only one slide or no slides
            
            // Explicitly enable if more than one slide
            if (totalSlides > 1) {
                if (prevButton) prevButton.disabled = false;
                if (nextButton) nextButton.disabled = false;
            }
        }

        if (prevButton) {
            prevButton.addEventListener('click', () => {
                if (totalSlides <= 0) return;
                currentIndex = (currentIndex - 1 + totalSlides) % totalSlides;
                showSlide(currentIndex);
            });
        }

        if (nextButton) {
            nextButton.addEventListener('click', () => {
                if (totalSlides <= 0) return;
                currentIndex = (currentIndex + 1) % totalSlides;
                showSlide(currentIndex);
            });
        }

        document.addEventListener('keydown', (event) => {
            if (totalSlides <= 1) return; // No keyboard nav if only one slide or no slides
            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') return;

            if (event.key === 'ArrowLeft') {
                if (prevButton && !prevButton.disabled) prevButton.click();
            } else if (event.key === 'ArrowRight') {
                if (nextButton && !nextButton.disabled) nextButton.click();
            }
        });
        
        document.addEventListener('DOMContentLoaded', () => {
            setContentAreaPadding();
            showSlide(currentIndex); // Initial slide display

            const chapterOverlay = document.getElementById('globalLoadingOverlayChapter');
            if (chapterOverlay) {
                setTimeout(() => {
                    chapterOverlay.classList.add('visually-hidden');
                }, 150); 
            }
        });

        window.addEventListener('resize', setContentAreaPadding);

    </script>
    <script src="traffic-tracker.js"></script>
</body>
