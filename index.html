<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="icon" href="images/favicon.ico" type="image/x-icon">
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Portals</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@400;700&family=Medieval+Sharp&display=swap" rel="stylesheet">
    <!-- Google Analytics -->
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-D8RJ55C9S2"></script>
    <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-D8RJ55C9S2');
    </script>   
    <!-- End Google Analytics -->
</head>
<body>
    <header>
        <div class="header-top">
            <div class="site-identity">
                 <h1>The Portals</h1>
            </div>
        </div>
        <div class="header-description">
            <p class="site-motto">Nothing that’s worthwhile ever has a low Difficulty Class.</p>
        </div>
    </header>

    <main>


        <h2 id="showcase-heading" class="visually-hidden">Campaigns</h2>
        
        <!-- View Toggle Controls -->
        <section class="view-toggle-controls" aria-labelledby="view-toggle-heading">
            <h3 id="view-toggle-heading" class="visually-hidden">View Options</h3>
            <div class="toggle-buttons">
                <button id="banner-view-btn" class="view-toggle-btn active" aria-pressed="true" aria-label="Show campaigns as banners">
                    <span class="toggle-icon">🏞️</span>
                    <span class="toggle-text">Banner View</span>
                </button>
                <button id="icon-view-btn" class="view-toggle-btn" aria-pressed="false" aria-label="Show campaigns as icons">
                    <span class="toggle-icon">📱</span>
                    <span class="toggle-text">Icon View</span>
                </button>
            </div>
        </section>
        
        <section class="campaign-showcase" aria-labelledby="showcase-heading">
            <div class="campaign-grid" id="campaign-grid">

                <article class="campaign-card"
                    data-genre="fantasy adventure steampunk"
                    data-campaign-title="Vumbua"
                    data-poster-image="images/vumbua.jpg"
                    data-full-synopsis="A graphic novel detailing the trials, tribulations, and adventures of students at the prestigious Vumbua Academy across Sessions 0 to 6."
                    data-chapters='[
                        {"title": "Sessions 1-6", "url": "vumbua-s1-6.html"},
                        {"title": "Session 7: Race Day", "url": "vumbua-s7.html"},
                        {"title": "Session 8: Squad 907", "url": "vumbua-s8.html"},
                        {"title": "Session 9: Five Sectors", "url": "vumbua-s9.html"},
                        {"title": "Session 10: Dagger Sharks", "url": "vumbua-s10.html"},
                        {"title": "Session 11: Don’t Touch My Biscuits", "url": "session11.html"},
                        {"title": "AI Almosts, Fails, Bloopers", "url": "vumbua-bloopers.html"}
                    ]'>
                    <div class="tarot-art-container">
                        <img src="images/vumbua.jpg" alt="Artwork for Vumbua campaign" class="campaign-poster">
                    </div>
                    <div class="tarot-info-container">
                        <h3 class="campaign-title">Vumbua</h3>
                    </div>
                </article>

                <article class="campaign-card"
                    data-genre="fantasy adventure"
                    data-campaign-title="The Chronicles of Meryl"
                    data-poster-image="images/meryl.jpg"
                    data-full-synopsis="She said it was just a babysitting job, there was no mention of trials!"
                    data-chapters='[
                        {"title": "Meryl 1 - For the Nectar", "url": "meryl1.html"},
                        {"title": "Meryl 2 - Smells like Magic and Music", "url": "meryl2.html"},
                        {"title": "Meryl 3 - We Will Chop You", "url": "meryl3.html"}

                    ]'>
                    <div class="tarot-art-container">
                        <img src="images/meryl.jpg" alt="Artwork for The Chronicles of Meryl campaign" class="campaign-poster">
                    </div>
                    <div class="tarot-info-container">
                        <h3 class="campaign-title">The Chronicles of Meryl</h3>
                    </div>
                </article>

                <article class="campaign-card"
                    data-genre="sci-fi litrpg"
                    data-campaign-title="Dungeon Crawlers"
                    data-poster-image="images/dungeon-crawlers.jpg"
                    data-full-synopsis="In a world where reality blends with the digital, participants are thrust into deadly dungeons. Crawl to survive, level up, and uncover the secrets of this immersive LitRPG universe. Every choice matters when it's kill or be killed."
                    data-chapters='[
                        {"title": "Chapter 1: The Syndicate has your planet", "url": "dc-ch1.html"},
                        {"title": "Chapter 2: Llamas, Loot, and a Polish Lunch", "url": "dc-ch2.html"}
                    ]'>
                    <div class="tarot-art-container">
                        <img src="images/dungeon-crawlers.jpg" alt="Artwork for Dungeon Crawlers campaign" class="campaign-poster">
                    </div>
                    <div class="tarot-info-container">
                        <h3 class="campaign-title">Dungeon Crawlers</h3>
                    </div>
                </article>
             
                <!-- 
                    ADDING NEW CAMPAIGNS:
                    To add a new campaign, copy this structure and update the following:
                    
                    1. data-genre: Space-separated genres (e.g., "fantasy adventure", "sci-fi litrpg")
                    2. data-campaign-title: Campaign name for display
                    3. data-poster-image: Path to campaign artwork in images/ directory
                    4. data-full-synopsis: Full campaign description (shown in modal)
                    5. data-chapters: JSON array with title and URL for each chapter
                    6. campaign-poster src and alt: Update image path and description
                    7. campaign-title: Update displayed title
                    
                    See README.md for detailed instructions.
                -->
                
                <article class="campaign-card"
                    data-genre="fantasy adventure"
                    data-campaign-title="Verdant Scar"
                    data-poster-image="images/verdant-scar.jpg"
                    data-full-synopsis="It's a war of plastic and magic, where the fate of the realm hangs in the balance."
                    data-chapters='[
                        {"title": "Chapters 1-9", "url": "sigmar1-9.html"},
                        {"title": "Chapter 10", "url": "sigmar-ch10.html"}
                    ]'>
                    <div class="tarot-art-container">
                        <img src="images/verdant-scar.jpg" alt="Artwork for Verdant Scar campaign" class="campaign-poster">
                    </div>
                    <div class="tarot-info-container">
                        <h3 class="campaign-title">Verdant Scar</h3>
                    </div>
                </article>
           
            </div>
        </section>

        <!-- Dice Roller Section -->
        <section class="dice-roller">
            <button id="rollDiceBtn">Roll D20</button>
            <div id="diceResult" class="dice-result">🎲</div>
        </section>
    </main>

    <div id="campaignModal" class="modal-overlay" aria-hidden="true">
        <div class="modal-content" role="dialog" aria-labelledby="modalTitle" aria-describedby="modalSynopsis">
            <button class="modal-close-btn" aria-label="Close modal">&times;</button>
            <img src="" alt="Campaign Art" id="modalImage" class="modal-campaign-art">
            <div class="modal-text-content">
                <div class="modal-header-flex" style="display: flex; justify-content: space-between; align-items: center; gap: 15px; margin-bottom: 10px;">
                    <h2 id="modalTitle" class="modal-campaign-title" style="margin-bottom: 0;"></h2>
                    <button id="modalShareBtn" class="share-btn" aria-label="Share this campaign">📤 Share</button>
                </div>
                <div class="modal-genre-tags"></div>
                <p id="modalSynopsis" class="modal-campaign-synopsis"></p>
                <div class="modal-chapters-section">
                    <h3>Chapters</h3>
                    <ul id="modalChapterList" class="modal-chapter-list"></ul>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; No electrons were harmed in the making of this whatever it is.</p>
    </footer>

    <div id="globalLoadingOverlay" class="global-loading-overlay visually-hidden">
        <img src="images/archway-loaded.gif" alt="Loading..." class="global-loading-gif" />
    </div>

    <script src="script.js"></script>
</body>
</html>
